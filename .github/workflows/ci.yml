name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
      - run: pnpm install --frozen-lockfile
      - run: make check
      - run: make pack
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: '*.shell-extension.zip'
